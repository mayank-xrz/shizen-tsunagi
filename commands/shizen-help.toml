description = "Quick reference for shizen levels, skills, and commands"
prompt = "Show the shizen quick reference. One shot, change nothing: do not switch mode, write flag files, or persist anything. Levels: /shizen lite (build what's asked, name the sparer alternative in one line), /shizen (full, the default ladder: YAGNI then stdlib then native then one line then minimum), /shizen ultra (deletion before addition, challenges the requirement before building). Commands: /shizen-review (over-engineering review of the current changes), /shizen-audit (whole-repo over-engineering audit), /shizen-debt (harvest shizen: comments into a tracked ledger), /shizen-help (this card). Deactivate with 'stop shizen', 'normal mode', or /shizen off; resume anytime with /shizen. Default mode is full; change it with the SHIZEN_DEFAULT_MODE environment variable (off|lite|full|ultra) or a config file at ~/.config/shizen/config.json (Windows: %APPDATA%\\shizen\\config.json) with {\"defaultMode\": \"lite\"}. Resolution order: env var, then config file, then full."
